# ==============================================================================
# FILE: python_project/render.yaml
# PURPOSE:
#   One-click Render.com Blueprint for hosting the 100% Python Flask application
#   directly from a GitHub repository.
# ==============================================================================
services:
  - type: web
    name: smart-pest-detection-python
    runtime: python
    rootDir: python_project
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
